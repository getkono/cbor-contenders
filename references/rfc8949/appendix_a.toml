# RFC 8949 Appendix A, Table 6 ("Examples of Encoded CBOR Data Items"),
# transcribed from `rfc8949.txt` beside this file: every row's diagnostic
# notation and encoding exactly as the RFC prints them (`conformance` tests
# that they are), plus, per row, what this harness decodes it into and what
# it must decode to. `target` and `expect` are this repository's reading of
# the diagnostic notation, not the RFC's text:
#
# - `target`: the Rust type decoded into (`u64`, `i64`, `i128`, `u128`,
#   `f64`, `bool`, `option` (an `Option<u8>`), `string`, `bytes`
#   (`serde_bytes::ByteBuf`), `value` (`serde_json::Value`), `int-map`
#   (`BTreeMap<u64, u64>`), or `ignored` (`IgnoredAny`)).
# - `expect`: the value, as JSON text: an `f64` as its bit pattern
#   (`"0x..."`, or `"nan"` for any NaN), bytes as hex, a 128-bit integer as
#   its decimal digits, `option`'s `None` as absent.
# - `gate = false` with `why`: a row whose answer RFC 8949 leaves to the
#   implementation; its outcome is recorded, not gated.
#
# The table is a Code Component under the IETF Trust Legal Provisions
# (section 4; tables of values and CBOR are listed Code Components), so it is
# used under the Revised BSD License; see LICENSE.

