[package]
name = "conformance"
description = "Conformance of every compiled CBOR candidate: RFC 8949, serde's derive, and a differential against the serde_cbor oracle."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Forwarded one-to-one to `codecs`, as in `cell`.
[features]
ciborium = ["codecs/ciborium"]
minicbor-serde = ["codecs/minicbor-serde"]
cbor4ii = ["codecs/cbor4ii"]
cbor2 = ["codecs/cbor2"]
c2pa_cbor = ["codecs/c2pa_cbor"]

[dependencies]
alloc-count.workspace = true
bytes = { workspace = true, features = ["serde"] }
codecs.workspace = true
faithful.workspace = true
hex.workspace = true
payloads.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_cbor.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml = "0.8"

# Only to switch core dumps off in a depth probe that may overflow its stack.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
