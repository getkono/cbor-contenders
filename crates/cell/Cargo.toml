[package]
name = "cell"
description = "The one binary every per-operation measurement runs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Forwarded one-to-one to `codecs`. A measurement build enables at most one.
[features]
ciborium = ["codecs/ciborium"]
minicbor-serde = ["codecs/minicbor-serde"]
minicbor = ["codecs/minicbor", "payloads/minicbor"]
cbor4ii = ["codecs/cbor4ii"]
cbor2 = ["codecs/cbor2"]
c2pa_cbor = ["codecs/c2pa_cbor"]
# The counting allocator, for the `alloc` mode only. Every allocation through
# it pays several atomic operations a server never pays, so the builds that
# take cycles, time and callgrind counts leave it out.
count-alloc = []

[dependencies]
alloc-count.workspace = true
bytes.workspace = true
codecs.workspace = true
payloads.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_cbor.workspace = true
libc = "0.2"
perf-event2 = "0.7"

[lints]
workspace = true
