[package]
name = "size-fixture"
description = "Programs whose .text is compared: what linking a codec costs a binary."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# One codec per build; with none, the fixture uses serde_json. `prost`
# selects the protobuf baseline, which every build has but only this one
# links.
[features]
prost = []
ciborium = ["codecs/ciborium"]
minicbor-serde = ["codecs/minicbor-serde"]
minicbor = ["codecs/minicbor", "dep:minicbor"]
cbor4ii = ["codecs/cbor4ii"]
cbor2 = ["codecs/cbor2"]
c2pa_cbor = ["codecs/c2pa_cbor"]

[dependencies]
bytes.workspace = true
codecs.workspace = true
serde.workspace = true
prost.workspace = true
prost-derive = "=0.14.4"
minicbor = { workspace = true, optional = true, features = ["derive"] }

# Only to hold the copied body types to the originals; a dev-dependency is
# never part of the measured build.
[dev-dependencies]
payloads.workspace = true
serde_cbor.workspace = true
serde_json.workspace = true

[lints]
workspace = true
