[package]
name = "size-fixture"
description = "Programs whose .text is compared: what linking a codec costs a binary."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# One codec per measured build, each feature the codec's crate and nothing
# else: the fixture depends on the library directly, not on `codecs`, which
# always links serde_json, serde_cbor and prost, so a candidate's clean build
# and `.text` hold the candidate alone. `xtask` builds the fixture with
# `--no-default-features` and one of these. The defaults (serde_json, and
# prost for the body types' protobuf derive) are only for the workspace's own
# lint and test builds; a test build with several picks the first in
# `select!`.
[features]
default = ["serde_json", "prost"]
serde_json = ["dep:serde_json"]
prost = ["dep:prost", "dep:prost-derive"]
ciborium = ["dep:ciborium"]
minicbor-serde = ["dep:minicbor-serde"]
minicbor = ["dep:minicbor"]
cbor4ii = ["dep:cbor4ii"]
cbor2 = ["dep:cbor2"]
c2pa_cbor = ["dep:c2pa_cbor"]

[dependencies]
bytes.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-derive = { version = "=0.14.4", optional = true }
ciborium = { workspace = true, optional = true }
minicbor = { workspace = true, optional = true, features = ["derive"] }
minicbor-serde = { workspace = true, optional = true }
cbor4ii = { workspace = true, optional = true }
cbor2 = { workspace = true, optional = true }
c2pa_cbor = { workspace = true, optional = true }

# Only to hold the copied body types to the originals; a dev-dependency is
# never part of the measured build.
[dev-dependencies]
codecs.workspace = true
payloads.workspace = true
serde_cbor.workspace = true
serde_json.workspace = true

[lints]
workspace = true
