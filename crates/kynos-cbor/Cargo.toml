[package]
name = "kynos-cbor"
description = "A worked outside BodyCodec for application/cbor: Kynos's Encoded<C, T> over any CBOR library, held to the JSON data model."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Which CBOR library the codec sits on, one per build as everywhere else.
[features]
ciborium = ["codecs/ciborium"]
minicbor-serde = ["codecs/minicbor-serde"]
cbor4ii = ["codecs/cbor4ii"]
cbor2 = ["codecs/cbor2"]
c2pa_cbor = ["codecs/c2pa_cbor"]

[dependencies]
bytes.workspace = true
codecs.workspace = true
faithful.workspace = true
kynos.workspace = true
serde.workspace = true

[dev-dependencies]
kynos = { workspace = true, features = ["test-util"] }
serde_bytes.workspace = true
serde_cbor.workspace = true
serde_json.workspace = true
tokio.workspace = true

[[example]]
name = "serve"
required-features = ["ciborium"]

[lints]
workspace = true
