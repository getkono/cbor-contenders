[package]
name = "fuzz"
description = "Differential fuzzing of each CBOR candidate against the serde_cbor oracle and RFC 8949 well-formedness."
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# A workspace of its own: fuzzing needs nightly and sanitizer flags that must
# never reach the measured builds.
[workspace]

[features]
ciborium = ["codecs/ciborium"]
minicbor-serde = ["codecs/minicbor-serde"]
cbor4ii = ["codecs/cbor4ii"]
cbor2 = ["codecs/cbor2"]
c2pa_cbor = ["codecs/c2pa_cbor"]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
bytes = "1"
codecs = { path = "../crates/codecs" }
faithful = { path = "../crates/faithful" }
libfuzzer-sys = "0.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_cbor = { version = "=0.11.2", default-features = false, features = ["std"] }
serde_json = "=1.0.154"

[[bin]]
name = "decode_value"
path = "fuzz_targets/decode_value.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_struct"
path = "fuzz_targets/decode_struct.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
