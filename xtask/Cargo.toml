[package]
name = "xtask"
description = "Builds the matrix, runs every measurement, and writes the results and the report."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
codecs.workspace = true
faithful.workspace = true
payloads.workspace = true
# The wire-size axis: gzip at the level HTTP servers default to, and zstd at
# its own default, both pinned (a compressor change moves every figure).
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
zstd = { version = "=0.13.4", default-features = false }
serde.workspace = true
serde_json.workspace = true
object = { version = "0.36", default-features = false, features = ["read"] }
semver = "1"
sha2.workspace = true
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"
walkdir = "2"

[lints]
workspace = true
